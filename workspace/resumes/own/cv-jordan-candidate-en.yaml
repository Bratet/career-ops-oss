design:
  theme: engineeringresumes
  page:
    size: a4
    top_margin: 1.0cm
    bottom_margin: 1.0cm
    left_margin: 1.2cm
    right_margin: 1.2cm
    show_footer: false
    show_top_note: false
  typography:
    font_size:
      body: 9pt
      name: 24pt
      headline: 10.5pt
      connections: 8.5pt
      section_titles: 1.2em
    bold:
      headline: false
    line_spacing: 0.5em
    alignment: left
    font_family:
      headline: Source Sans 3
      body: XCharter
      name: XCharter
      connections: XCharter
      section_titles: XCharter
  colors:
    name: rgb(17,45,78)
    headline: rgb(75,85,95)
    section_titles: rgb(17,45,78)
    links: rgb(17,45,78)
    connections: rgb(60,60,60)
  section_titles:
    space_above: 0.3cm
    space_below: 0.2cm
  sections:
    space_between_regular_entries: 0.35cm
    space_between_text_based_entries: 0.15cm
  header:
    space_below_name: 0.4cm
    space_below_headline: 0.35cm
    connections:
      phone_number_format: international
